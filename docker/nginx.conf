user root;
events {}
http {
    access_log off;
    server_tokens off;
    upstream engine { server unix:/var/run/docker.sock; }
    server {
        listen 2375;
        if ($request_method != GET) { return 405; }
        location ~ ^/(version|v1\.[0-9]+/(containers/json|events))$ {
            proxy_pass http://engine;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
        location / { return 403; }
    }
}
