name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm test
  docker-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        proxy: ['0', '1']
    env:
      DISCOVERY_PROXY: ${{ matrix.proxy }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/docker/.runtime/browsers
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: docker
      - run: npx playwright install --with-deps chromium
        working-directory: docker
      - run: node docker/replay.mjs build
      - run: node docker/replay.mjs up
      - run: node docker/replay.mjs test
      - if: always()
        run: node docker/replay.mjs down
  image:
    needs: [unit, docker-browser]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Select image tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          tags="$IMAGE:sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(node -p 'require("./package.json").version')
            [[ "$GITHUB_REF_NAME" == "v$version" ]]
            gh release view "$GITHUB_REF_NAME" --json tagName --jq .tagName
            tags="$tags,$IMAGE:$version"
            latest=$(gh release view --json tagName --jq .tagName)
            if [[ "$latest" == "$GITHUB_REF_NAME" ]]; then
              tags="$tags,$IMAGE:latest"
            fi
          elif [[ $(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) == "$GITHUB_SHA" ]]; then
            tags="$tags,$IMAGE:main"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BSD-3-Clause
  release:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      - name: Check the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: gh workflow run ci.yaml --ref "$RELEASE_BRANCH"
      # Dispatch explicitly: releases created with GITHUB_TOKEN trigger no workflows.
      - name: Build the release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run ci.yaml --ref "$RELEASE_TAG"
